name: Distributed tests

on:
  workflow_dispatch:

concurrency:
  group: distributed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.8"
  UV_VERSION: "0.10.9"
  BIOIMAGEFLOW_HOME: ${{ github.workspace }}/.ci/bioimageflow-home
  BIOIMAGEFLOW_TOOL_STORE: ${{ github.workspace }}/.ci/bioimageflow-home/tool_packages
  BIOIMAGEFLOW_WETLANDS: ${{ github.workspace }}/.ci/bioimageflow-home/wetlands
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_FROZEN: "1"
  UV_LINK_MODE: copy
  BIOIMAGEFLOW_TEST_SUITE: distributed

jobs:
  backend:
    name: Distributed backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Run distributed backend tests
        run: scripts/test focus backend -m 'not external'

  frontend:
    name: Distributed frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Bun
        run: npm install --global "bun@$BUN_VERSION"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Run distributed frontend tests
        run: scripts/test focus unit

  browser:
    name: Distributed browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Install Bun
        run: npm install --global "bun@$BUN_VERSION"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install browser
        working-directory: frontend
        run: bunx playwright install --with-deps "${{ matrix.browser }}"
      - name: Run distributed browser tests
        run: scripts/test focus e2e --project=${{ matrix.browser }}
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributed-${{ matrix.browser }}-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
