name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.8"
  UV_VERSION: "0.10.9"
  BIOIMAGEFLOW_HOME: ${{ github.workspace }}/.ci/bioimageflow-home
  BIOIMAGEFLOW_TOOL_STORE: ${{ github.workspace }}/.ci/bioimageflow-home/tool_packages
  BIOIMAGEFLOW_WETLANDS: ${{ github.workspace }}/.ci/bioimageflow-home/wetlands
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_FROZEN: "1"
  UV_LINK_MODE: copy

jobs:
  frontend:
    name: Frontend quality
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Bun
        run: npm install --global "bun@$BUN_VERSION"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Type-check
        working-directory: frontend
        run: bun run type-check
      - name: Run unit tests
        run: scripts/test focus unit

  backend:
    name: Backend quality
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Ruff
        working-directory: backend
        run: uv run --frozen ruff check .
      - name: Run deterministic backend tests
        run: scripts/test focus backend -m 'not external'
      - name: Check logging order
        working-directory: backend
        run: >-
          uv run --frozen pytest
          tests/test_logging_config.py
          tests/test_ws/test_handler.py::test_publish_without_loop_drops_silently
          tests/test_ws/test_handler.py::test_publish_logs_future_exceptions
          tests/test_ws/test_logging_bridge.py::test_attach_to_bioimageflow_logger
          -q

  documentation:
    name: Documentation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt
      - name: Install documentation dependencies
        run: |
          uv venv
          uv pip install -r docs/requirements.txt
      - name: Build documentation
        run: .venv/bin/sphinx-build -W --keep-going docs docs/_build/html
      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7

  chromium:
    name: Chromium
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Bun
        run: npm install --global "bun@$BUN_VERSION"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run Chromium tests
        run: scripts/test focus e2e
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  full:
    name: Full certification
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Bun
        run: npm install --global "bun@$BUN_VERSION"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium firefox
      - name: Run full suite
        run: scripts/test full
      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-certification-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/.pytest_cache/coverage.xml
            backend/.pytest_cache/htmlcov/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
