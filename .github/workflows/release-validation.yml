name: Release validation

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BIOIMAGEFLOW_HOME: ${{ github.workspace }}/.ci/bioimageflow-home
  BIOIMAGEFLOW_TOOL_STORE: ${{ github.workspace }}/.ci/bioimageflow-home/tool_packages
  BIOIMAGEFLOW_WETLANDS: ${{ github.workspace }}/.ci/bioimageflow-home/wetlands
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_LINK_MODE: copy
  BIOIMAGEFLOW_TEST_SUITE: local

jobs:
  certification:
    name: Full local release certification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.9'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Bun
        run: npm install --global bun@1.3.8
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install browser engines
        working-directory: frontend
        run: bunx playwright install --with-deps chromium firefox
      - name: Full release validation
        run: |
          mkdir -p .ci
          scripts/test full 2>&1 | tee .ci/release-full.log
      - name: Documentation validation
        run: scripts/test check docs 2>&1 | tee .ci/release-docs.log
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ github.sha }}
          path: |
            .ci/release-*.log
            backend/.pytest_cache/coverage.xml
            frontend/test-results/
            frontend/playwright-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
