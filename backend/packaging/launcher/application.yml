name: BioImageFlow
repository: https://gitlab.inria.fr/sairpico/bioimageflow-platform
auto_update: true
configuration: backend/pyproject.toml
entrypoint:
  mode: module
  module: bioimageflow_server
  args:
    - --desktop
    - --port
    - "8765"
release:
  archive:
    build:
      - command: ["bun", "install"]
        cwd: frontend
      - command: ["bun", "run", "build"]
        cwd: frontend
    include:
      - frontend/dist
extras:
  - desktop
init_message: "BioImageFlow Desktop Initialized"


trust:
  mode: signed_manifest
  public_key: "EkHDcuYwX66v/6gjGreju/Ke+IxfZsa58IZBsnIjPK8="
