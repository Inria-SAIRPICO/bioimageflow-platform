[project]
name = "bioimageflow-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "websockets>=15.0",
    "python-multipart>=0.0.20",
    "watchdog>=6.0",
    "httpx>=0.27",
    "packaging>=24.0",
    "send2trash>=1.8",
    "pandas>=2.0",
    "Pillow>=10.0",
    "tifffile>=2024.0",
    "keyring>=25.0",
    "bioimageflow-core>=0.1.0",
    "bioimageflow>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "httpx>=0.27",
    "ruff>=0.9",
]
desktop = [
    "pywebview>=5.0",
]

[project.scripts]
bioimageflow-gui = "bioimageflow_server.desktop:main_desktop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioimageflow_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/bioimageflow_server/data/default_known_packages.txt" = "bioimageflow_server/data/default_known_packages.txt"
"src/bioimageflow_server/_external/napari_manager.py" = "bioimageflow_server/_external/napari_manager.py"
"src/bioimageflow_server/_external/thumbnail_generator.py" = "bioimageflow_server/_external/thumbnail_generator.py"
"src/bioimageflow_server/_external/opener" = "bioimageflow_server/_external/opener"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
bioimageflow-core = { path = "../bioimageflow/packages/bioimageflow-core", editable = true }
bioimageflow = { path = "../bioimageflow/packages/bioimageflow", editable = true }
