[project]
name = "bioimageflow-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "websockets>=15.0",
    "python-multipart>=0.0.20",
    "watchdog>=6.0",
    "httpx>=0.27",
    "packaging>=24.0",
    "send2trash>=1.8",
    "pandas>=2.0",
    "Pillow>=10.0",
    "tifffile>=2024.0",
    "keyring>=25.0",
    "bioimageflow-core>=0.1.6",
    "bioimageflow>=0.1.6",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "pywebview>=5.0",
]
desktop = [
    "pywebview>=5.0",
]

[project.scripts]
bioimageflow-gui = "bioimageflow_server.desktop:main_desktop"
bioimageflow-mcp = "bioimageflow_server.agent_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioimageflow_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/bioimageflow_server/logging.yaml" = "bioimageflow_server/logging.yaml"
"src/bioimageflow_server/data/default_known_packages.txt" = "bioimageflow_server/data/default_known_packages.txt"
"src/bioimageflow_server/_external/napari_manager.py" = "bioimageflow_server/_external/napari_manager.py"
"src/bioimageflow_server/_external/thumbnail_generator.py" = "bioimageflow_server/_external/thumbnail_generator.py"
"src/bioimageflow_server/_external/opener/README.md" = "bioimageflow_server/_external/opener/README.md"
"src/bioimageflow_server/_external/opener/bioimageflow-opener-0.1.0.vsix" = "bioimageflow_server/_external/opener/bioimageflow-opener-0.1.0.vsix"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "common_tools: optional certification tests requiring an installed bioimageflow_common_tools tool store; set BIOIMAGEFLOW_TOOL_STORE or BIOIMAGEFLOW_HOME.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src/bioimageflow_server"]
exclude = ["src/bioimageflow_server/_external"]
reportMissingTypeStubs = false

[tool.uv.sources]
bioimageflow-core = { path = "../bioimageflow/packages/bioimageflow-core", editable = true }
bioimageflow = { path = "../bioimageflow/packages/bioimageflow", editable = true }
launcher = { path = "../../launcher", editable = true }

[dependency-groups]
dev = [
    "launcher",
    "pyright>=1.1.409",
]
