[project]
name = "bioimageflow-server"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "websockets>=15.0",
    "python-multipart>=0.0.20",
    "watchdog>=6.0",
    "httpx>=0.27",
    "packaging>=24.0",
    "send2trash>=1.8",
    "pandas>=2.0",
    "Pillow>=10.0",
    "tifffile>=2024.0",
    "keyring>=25.0",
    "bioimageflow-core>=0.1.7",
    "bioimageflow>=0.1.8",
    "wetlands>=1.1.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
]

[project.scripts]
bioimageflow-gui = "bioimageflow_server.desktop:main_desktop"
bioimageflow-mcp = "bioimageflow_server.agent_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioimageflow_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/bioimageflow_server/logging.yaml" = "bioimageflow_server/logging.yaml"
"src/bioimageflow_server/data/agent_workspace_instructions.md" = "bioimageflow_server/data/agent_workspace_instructions.md"
"src/bioimageflow_server/data/default_known_packages.txt" = "bioimageflow_server/data/default_known_packages.txt"
"src/bioimageflow_server/_external/napari_manager.py" = "bioimageflow_server/_external/napari_manager.py"
"src/bioimageflow_server/_external/thumbnail_generator.py" = "bioimageflow_server/_external/thumbnail_generator.py"
"src/bioimageflow_server/_external/opener/README.md" = "bioimageflow_server/_external/opener/README.md"
"src/bioimageflow_server/_external/opener/bioimageflow-opener-0.1.0.vsix" = "bioimageflow_server/_external/opener/bioimageflow-opener-0.1.0.vsix"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "integration: tests that cross application, service, filesystem, or execution boundaries.",
    "serial: tests that mutate process-global state and must not run concurrently.",
    "slow: measured slow tests excluded from the inner coding loop.",
    "external: certification tests requiring separately installed packages or services.",
    "common_tools: external certification tests requiring --run-external (or --run-common-tools) and an installed bioimageflow_common_tools tool store.",
]

[tool.coverage.run]
branch = true
source = ["bioimageflow_server"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src/bioimageflow_server"]
exclude = [
    "src/bioimageflow_server/_external",
    "src/bioimageflow_server/data/demo_workflows",
]
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
    "ruff>=0.9",
    "pywebview>=5.0",
    "wetlands-launcher>=0.3.4",
]
